# SubTrack — прод-развёртывание рядом с существующим reverse-proxy (Caddy).
# Порты наружу НЕ публикуются: доступ только через Caddy по внутренней сети.
# БД изолирована во внутренней сети (недоступна извне и из чужих контейнеров).
#
# Внешняя сеть `web` = сеть, в которой уже живёт Caddy (напр. outline_internal).
# Caddy обращается к приложению по алиасу `subtrack-app:3000`.
#
#   docker compose -f docker-compose.prod.yml up -d --build
name: subtrack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: subtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      db:
        # Уникальный алиас: имя `postgres` может конфликтовать с чужим стеком
        # в общей сети Caddy (напр. postgres вики). Подключаемся по нему.
        aliases:
          - subtrack-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtrack -d subtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot миграции на полном builder-образе (в тонком standalone-образе нет
  # транзитивных зависимостей prisma CLI). Слои общие с app — диск почти не растёт.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://subtrack:${POSTGRES_PASSWORD}@subtrack-postgres:5432/subtrack?schema=public"
    networks:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Миграции выполняет сервис migrate; app лишь запускает сервер (минуя
    # docker-entrypoint.sh, чтобы не звать prisma CLI из тонкого образа).
    entrypoint: ["node"]
    command: ["server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://subtrack:${POSTGRES_PASSWORD}@subtrack-postgres:5432/subtrack?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET не задан в .env}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:-}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:-}"
      AUTH_URL: "${AUTH_URL:?AUTH_URL не задан в .env}"
      NEXTAUTH_URL: "${AUTH_URL}"
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      APP_TZ: "${APP_TZ:-Europe/Kyiv}"
      BASE_CURRENCY: "${BASE_CURRENCY:-USD}"
      # Прод: демо-данные НЕ засеваются (админы whitelist'а — из ADMIN_EMAILS).
      SEED_ON_START: "false"
      NODE_ENV: "production"
    networks:
      db:
      web:
        aliases:
          - subtrack-app

networks:
  # Внутренняя сеть БД: недоступна снаружи.
  db:
    internal: true
  # Существующая сеть Caddy (задаётся при развёртывании — см. docs/DEPLOY.md).
  web:
    external: true
    name: ${CADDY_NETWORK:-outline_internal}

volumes:
  pgdata:
